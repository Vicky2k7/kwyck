<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.W.Y.C.K.</title>

    <meta property="og:title" content="K.W.Y.C.K.">
    <meta property="og:description" content="Kloecke Waergebóren ende Ydelmoedighe Collegie der Kwanthen">

    <style>
        #center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;

            width: 80%;
            max-width: 20rem;

            padding: 1rem;
            border: 1px solid black;
        }

        #center h1::after {
            display: block;
            content:"";
            height:0.25rem;
            width:0%;
            background-color:purple;

            transition: ease-in-out 1s;
        }

        #center h1:hover::after {
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="center">
        <h1>K.W.Y.C.K.</h1><span> ~ MMXXVI</span>
        <p><i>Kloecke Waergebóren ende Ydelmoedighe Collegie der Kwanthen</i></p>
    </div>
</body>
</html>
